packages:
  - apps/*
  - packages/*
enableGlobalVirtualStore: false
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  vue-demi: true
  '@scarf/scarf': false
  core-js: false
  core-js-pure: false
  es5-ext: false
overrides:
  '@nestjs/platform-express>multer': 2.4.0
  '@nestjs/config>lodash': 4.18.1
  '@nuxt/devtools>simple-git': 4.0.1
  'simple-git>@simple-git/argv-parser': 2.0.1
  '@prisma/config>deepmerge-ts': 8.0.0
  'fontless>esbuild': 0.28.1
patchedDependencies:
  nuxt@4.5.2: patches/nuxt@4.5.2.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
